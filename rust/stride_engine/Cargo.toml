[package]
name = "stride_engine"
version = "0.1.0"
edition = "2021"
description = "Core walking/running workout engine for S.T.R.I.D.E. - state machine, GPS filtering, distance/pace/speed/calorie calculation, activity classification."

[lib]
name = "stride_engine"
# cdylib: shared library consumed by Flutter via dart:ffi
# staticlib: for iOS static linking
# rlib: for native Rust unit testing
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# NOTE: panic stays "unwind" (default) because this crate is loaded as a
# shared library inside a long-lived Flutter/Dart host process. Every FFI
# entry point wraps its body in std::panic::catch_unwind so a Rust panic
# turns into an error result instead of aborting the whole app process.
strip = true

[dev-dependencies]
